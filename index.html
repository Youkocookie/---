<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北海道的北海道</title>
    <!-- 引入 SortableJS 確保手機端可以順暢拖曳排序 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'PingFang TC', '微軟正黑體', sans-serif;
            background-color: #F4F9FF; /* Very light baby blue */
            color: #334155; /* Dark grey/blue */
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #FFFFFF;
            border: 2px solid #BFE2FF; /* Light blue borders */
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(191, 226, 255, 0.3);
            text-align: center;
            margin-top: 2vh;
            position: relative;
        }
        
        /* 共用按鈕樣式 */
        .btn-main, .date-btn, .option-btn, .btn-outline {
            background-color: #FFFFFF;
            color: #334155;
            border: 2px solid #BFE2FF;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-main {
            margin-top: 20px;
            background-color: #F4F9FF;
        }
        .btn-main:active, .date-btn:active, .option-btn:active, .btn-outline:active {
            background-color: #BFE2FF;
            transform: scale(0.98);
        }
        
        /* 首頁封面文字 */
        .cover-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: center;
            white-space: pre-wrap; /* 保留換行符號 */
            color: #334155;
            font-weight: 500;
        }

        /* 日期網格 */
        .date-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        
        /* 返回按鈕 (左上角文字版) */
        .back-link {
            text-align: left;
            margin-bottom: 15px;
            display: inline-block;
            cursor: pointer;
            color: #7DD3FC;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }
        .back-link:active {
            color: #38BDF8;
        }

        /* 題目區塊 */
        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: left;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            text-align: left;
            font-weight: normal;
        }

        /* 拖曳排序清單 */
        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sortable-item {
            background-color: #FFFFFF;
            border: 2px dashed #BFE2FF;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            color: #334155;
            touch-action: none; /* 讓手機拖曳更順 */
        }
        .sortable-item::before {
            content: '≡';
            margin-right: 15px;
            color: #93C5FD;
            font-weight: bold;
            font-size: 20px;
        }

        /* 隱藏區塊 */
        #screen-dates, #screen-question, #screen-updating, #screen-result {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    
    <!-- 1. 首頁封面 -->
    <div id="screen-cover">
        <h1 style="color:#334155; margin-top:0; font-size: 24px;">北海道的北海道⛄️</h1>
        <img src="pic10.png" style="width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(191,226,255,0.6); max-height: 220px; object-fit: cover;" alt="封面照">
        <div class="cover-text">
小寶🤍 
今天是Day8❄️ 
時間過得好快 要回台灣了🥹 
好期待見到寶寶喔～
今天唯一的行程 去機場！
寶貝今天上班加油～
我愛你❤️

</div>
        <button class="btn-main" onclick="showScreen('screen-dates')">開始連線！</button>
    </div>

    <!-- 2. 日期選擇畫面 -->
    <div id="screen-dates">
        <h2 style="color:#334155; margin-top:0;">今天是～</h2>
        <div class="date-grid" id="date-buttons-container">
            <!-- 由 JS 動態生成按鈕 -->
        </div>
        <button class="btn-outline" style="margin-top: 30px;" onclick="showScreen('screen-cover')">返回首頁</button>
    </div>

    <!-- 3. 問題畫面 -->
    <div id="screen-question">
        <div style="text-align: left;">
            <span class="back-link" onclick="goBackFromQuestion()">⬅ 返回上一頁</span>
        </div>
        <div class="question-text" id="q-text"></div>
        <div class="options-container" id="options-container"></div>
    </div>

    <!-- 4. 更新中畫面 -->
    <div id="screen-updating">
        <h2 style="color:#334155;">施工中</h2>
        <p style="margin: 30px 0; line-height: 1.6;">這天還在施工中！敬請期待 ✨</p>
        <button class="btn-outline" onclick="showScreen('screen-dates')">返回日期列表</button>
    </div>

    <!-- 5. 結算畫面 -->
    <div id="screen-result">
        <h2 style="color:#334155;">今天的連線完成囉！</h2>
        <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 15px;">
            <button id="line-btn" class="btn-main" style="margin-top: 0; background-color: #BFE2FF;">複製答案並傳送 LINE</button>
            <button class="btn-outline" onclick="showScreen('screen-dates')">期待下一天</button>
        </div>
    </div>

</div>

         "11/6": [

            { q: "Day 8 (11/6)\nQ2. 已經整整 8 天沒有見面了🥺 寶寶這幾天的想念程度在哪個等級？", options: ["超級想念！每天都在倒數寶寶回台灣的日子😭", "想念程度只有一半", "有好多自由時間 好讚！",  "默默想念，但有連線就覺得很安心🤍"] },

           { q: "Day 8 (11/6)\nQ4. 最後的最後🥺\n\n謝謝小寶這幾天每天都打給我、陪我聊天，真的很喜歡跟你講話！雖然人在北海道開心玩，但心裡還是真的好想你～<br>而且每天能叫你起床，都覺得好幸福🥰\n\n這次雖然沒有買到鞋子有一點點小可惜，但也許之後會遇到更適合我們的😍\n\n寶寶，我愛你！", options: ["我也愛你❤️"] }

    const allDates = ["10/30", "10/31", "11/1", "11/2", "11/3", "11/4", "11/5", "11/6"];
    let activeDate = "";
    let currentQIndex = 0;
    let currentAnswers = [];
    let sortableInstance = null;

    // 初始化日期按鈕
    const dateContainer = document.getElementById("date-buttons-container");
    allDates.forEach(date => {
        let btn = document.createElement("button");
        btn.className = "date-btn";
        btn.innerText = date;
        btn.onclick = () => selectDate(date);
        dateContainer.appendChild(btn);
    });

    function showScreen(screenId) {
        document.getElementById("screen-cover").style.display = "none";
        document.getElementById("screen-dates").style.display = "none";
        document.getElementById("screen-question").style.display = "none";
        document.getElementById("screen-updating").style.display = "none";
        document.getElementById("screen-result").style.display = "none";
        
        document.getElementById(screenId).style.display = "block";
    }

    function selectDate(date) {
        activeDate = date;
        currentQIndex = 0;
        currentAnswers = [];
        
        if (questionsData[date] && questionsData[date].length > 0) {
            showScreen("screen-question");
            renderQuestion();
        } else {
            showScreen("screen-updating");
        }
    }

    // 處理問答頁面的「返回上一頁」邏輯
    function goBackFromQuestion() {
        if (currentQIndex > 0) {
            // 退回上一題
            currentQIndex--;
            currentAnswers.pop(); // 移除上一題的答案紀錄
            renderQuestion();
        } else {
            // 如果是第一題，退回日期選單
            showScreen('screen-dates');
        }
    }

    function renderQuestion() {
        let qList = questionsData[activeDate];
        if (currentQIndex >= qList.length) {
            showDayResult();
            return;
        }

        let qData = qList[currentQIndex];
        const qText = document.getElementById("q-text");
        const optionsContainer = document.getElementById("options-container");
        
        // 替換換行符為 <br>
        qText.innerHTML = qData.q.replace(/\n/g, '<br>');
        optionsContainer.innerHTML = "";
        
        if (sortableInstance) {
            sortableInstance.destroy();
            sortableInstance = null;
        }

        if (qData.type === "sortable") {
            let ul = document.createElement("ul");
            ul.className = "sortable-list";
            ul.id = "sortable-list-id";
            
            qData.options.forEach((opt) => {
                let li = document.createElement("li");
                li.className = "sortable-item";
                li.innerText = opt;
                ul.appendChild(li);
            });
            
            optionsContainer.appendChild(ul);
            
            // 啟用手機支援的 SortableJS
            sortableInstance = new Sortable(ul, {
                animation: 150,
                ghostClass: 'sortable-ghost'
            });

            let confirmBtn = document.createElement("button");
            confirmBtn.className = "btn-main";
            confirmBtn.innerText = "確定排序";
            confirmBtn.onclick = () => {
                let sortedItems = [...ul.querySelectorAll('.sortable-item')].map((li, i) => `${i+1}. ${li.innerText}`);
                currentAnswers.push(`${qData.q}\n${sortedItems.join('\n')}`);
                currentQIndex++;
                renderQuestion();
            };
            optionsContainer.appendChild(confirmBtn);

        } else if (qData.multiSelect) {
            // 新增：複選題邏輯
            let selectedOptions = [];
            qData.options.forEach((opt) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    let idx = selectedOptions.indexOf(opt);
                    if (idx > -1) {
                        // 取消選取
                        selectedOptions.splice(idx, 1);
                        btn.style.backgroundColor = "#FFFFFF";
                    } else {
                        // 選取
                        selectedOptions.push(opt);
                        btn.style.backgroundColor = "#BFE2FF"; // 選中時變淺藍色
                    }
                };
                optionsContainer.appendChild(btn);
            });

            let confirmBtn = document.createElement("button");
            confirmBtn.className = "btn-main";
            confirmBtn.innerText = "選好了！";
            confirmBtn.onclick = () => {
                if (selectedOptions.length === 0) {
                    alert("至少選一個嘛🥺");
                    return;
                }
                currentAnswers.push(`${qData.q}\n👉 選擇了：${selectedOptions.join('、')}`);
                currentQIndex++;
                renderQuestion();
            };
            optionsContainer.appendChild(confirmBtn);

        } else {
            // 單選題邏輯
            qData.options.forEach((opt) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    currentAnswers.push(`${qData.q}\n👉 ${opt}`);
                    currentQIndex++;
                    renderQuestion();
                };
                optionsContainer.appendChild(btn);
            });
        }
    }

    function showDayResult() {
        showScreen("screen-result");
        const lineBtn = document.getElementById("line-btn");
        
        // 自動過濾並將 <br> 轉換為 LINE 看得懂的真實換行
        let rawAnswers = currentAnswers.join("\n\n");
        let cleanAnswers = rawAnswers.replace(/<br\s*\/?>/gi, '\n');
        let msg = `💌 小寶的北海道連線 (${activeDate}) 💌\n\n` + cleanAnswers;
        
        lineBtn.onclick = function() {
            // 建立一個隱藏的 textarea 來執行複製動作
            const textArea = document.createElement("textarea");
            textArea.value = msg;
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                alert("✅ 答案已經幫你複製好囉！\n\n現在為你轉跳到 LINE 🚀\n（如果沒有自動轉跳，你可以直接去 LINE 貼上！）");
            } catch (err) {
                console.error('複製失敗', err);
            }
            document.body.removeChild(textArea);

            
        };
    }
</script>
